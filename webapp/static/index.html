<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ATLAS — Sovereign Agent Harness</title>
  <link rel="stylesheet" href="/css/app.css">
  <link rel="stylesheet" href="/css/agent.css">
</head>
<body>
  <div class="app">
    <!-- THE SIDEBAR IS RETIRED (2026-10-07, his word: "go, next: retire the sidebar and the old dashboard").
         Every page is one list (App.PAGES, js/app.js), read by the front page's Pages menu, the palette
         (Ctrl K, on every page) and each page's crumb, whose ATLAS leads home. What the sidebar carried is on
         the front page's bar: the version, Boot and Close, the door's state, and who is signed in with Lock;
         the covenant is in its footer, and unsent work is a number on its Aider Pair door. -->
    <main class="main">
      <!-- ONE CRUMB, PAINTED BY THE ROUTER. It lives here rather than in each
           page's own header because the router is the only thing that knows
           where you are, and fourteen hand-written copies of the same line is
           fourteen chances for one of them to be wrong. -->
      <div class="crumb" id="crumb" hidden></div>
      <div id="content">
        <div class="loading">Loading...</div>
      </div>
    </main>
  </div>
  <div id="toast" class="toast"></div>
  <div id="modal" class="modal" style="display:none">
    <div class="modal-backdrop" onclick="App.closeModal()"></div>
    <div class="modal-content" id="modal-content"></div>
  </div>
  <script src="/js/api.js"></script>
  <script src="/js/lock.js"></script>
  <script src="/js/left.js"></script>
  <script src="/js/laws.js"></script>
  <script src="/js/projects.js"></script>
  <script src="/js/chat.js"></script>
  <script src="/js/council.js"></script>
  <script src="/js/agent.js"></script>
  <script src="/js/prompts.js"></script>
  <script src="/js/flows.js"></script>
  <script src="/js/workflows.js"></script>
  <script src="/js/palette.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
