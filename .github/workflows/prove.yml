# THE BATTERY, ON SOMEONE ELSE'S MACHINE.
#
# atlas had no CI at all until 2026-09-11. Every claim in this repo about the
# door -- 78 tools, 19 green packages, a battery of 35 legs -- rested on one
# machine, while the core beside it has been proving itself on four matrix legs
# per push since 2026-09-03. A stranger evaluating atlas had to take all of it
# on faith.
#
# NO NETWORK AFTER CHECKOUT, AND THAT IS A PROPERTY, NOT A CONVENIENCE.
# Cargo.lock holds three packages and all three are this workspace's own
# (atlas-core, atlas-store, atlas -- `store/src/ffi.rs`: "zero crates.io, zero
# downloads, zero compiler"). Both go.mod files are stdlib only. tests/prove.py
# imports nothing outside the standard library. So nothing here fetches a
# dependency, and if a change makes it need one, THAT IS THE REGRESSION.
#
# NO MODEL, NO RACK, NO :8090. The workflow legs and the e2e leg both need a
# live engine and are SKIPPED without --live, which this never passes. The
# battery says so in its own output rather than pretending.
#
# THREE VERDICTS, AND ABSENT IS NOT A PASS. tests/prove.py reports PASS, FAIL
# or ABSENT. Fourteen golden legs report ABSENT here and that is CORRECT: the
# goldens themselves are committed and travel, but RE-CUTTING one needs the
# private oracle ground it was cut from, and that ground does not ship and
# never will (CLAUDE.md RULE 1). They name ATLAS_ORACLE_ROOT so a reader can
# act on it. Only FAIL is red. See tests/PROVING.md.

name: prove

# A LINE IS PROVED ONCE (2026-10-09, the core's WHAT'S LEFT I1, sixth step): by
# its pull request, and main and the marks by their own push. A bare `push:` ran
# the battery on every line AND on its pull request, the same commit twice. Main
# takes a change only through a pull request whose battery is green, so that run
# is the one that counts; `workflow_dispatch` still proves any line by hand. The
# GITHUB leg of the battery (tests/prove.py) refuses a workflow that runs on pull
# requests and on a push to every line.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# ONE RUN PER REF, for the reason the core's workflow learned on 2026-09-10:
# five pushes in half an hour otherwise means twenty jobs, most of them proving
# commits that have already been replaced.
concurrency:
  group: prove-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------
  # THE GATE. This is the one that must be green.
  #
  # Windows because the Rust spine is Windows BY CONSTRUCTION: store/src/ffi.rs
  # does `#[link(name = "winsqlite3")]` against the Windows SDK's import
  # library, with no cfg(windows) guard and no alternative backend. It is not
  # an oversight to be fixed by a matrix entry -- it is the design (ADR-004,
  # socket-free kernels; the store links the OS's own SQLite rather than
  # vendoring one). On any other platform cargo fails at link time.
  # ---------------------------------------------------------------------
  ball:
    name: the battery (windows)
    # PINNED TO THE IMAGE windows-latest RAN ON 2026-11-04 (run 41873516439:
    # "Image: windows-2025-vs2026, Version: 20261030.294.1"), so GitHub moving
    # its -latest label cannot change what was proven. The job's NAME above is
    # the check main's ruleset waits for and does not carry the runner.
    runs-on: windows-2025-vs2026
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          # THE EXACT GO, FROM go.mod (2026-11-04). Both go.mod files carry a
          # `toolchain` line, and setup-go v6 installs the version that line
          # names (v5 read only the `go 1.26` line and took the newest 1.26.x
          # of the day). The check below refuses the two files disagreeing.
          go-version-file: line/go.mod
          cache: false # nothing to cache: stdlib only

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13.17"

      - name: The Rust that rust-toolchain.toml names
        # Installed by rustup from the file at the root, before anything asks
        # cargo for it. With no argument, `rustup toolchain install` installs
        # the toolchain the file makes active, and nothing else.
        run: rustup toolchain install

      - name: Toolchains, named in the log
        # A stranger reading a failed run should be able to tell a version
        # problem from a code problem without guessing.
        #
        # AND THE PINNED ONES, OR RED (2026-11-04, his word: "everything
        # pinned and versioned for CI"). rust-toolchain.toml names the Rust
        # and both go.mod files name the Go with a `toolchain` line; setup-go
        # reads that line through go-version-file. A runner that hands this
        # job anything else -- the file gone, the two go.mod files apart, a
        # default stable that won over the file -- stops here.
        shell: bash
        run: |
          go version
          cargo --version
          rustc --version
          python --version
          fail=0
          want_rust="$(sed -n 's/^channel *= *"\(.*\)".*/\1/p' rust-toolchain.toml)"
          got_rust="$(rustc --version | cut -d' ' -f2)"
          if [ -z "$want_rust" ] || [ "$got_rust" != "$want_rust" ]; then
            echo "REFUSED: rustc is '$got_rust', rust-toolchain.toml says '$want_rust'"; fail=1
          fi
          got_go="$(go env GOVERSION)"
          for mod in line webapp; do
            want_go="$(sed -n 's/^toolchain \(go[0-9.]*\).*/\1/p' "$mod/go.mod" | tr -d '\r')"
            if [ -z "$want_go" ] || [ "$got_go" != "$want_go" ]; then
              echo "REFUSED: go is '$got_go', $mod/go.mod says toolchain '$want_go'"; fail=1
            fi
          done
          [ "$fail" = 0 ] && echo "the toolchains are the pinned ones: rust $got_rust, $got_go"
          exit $fail

      - name: Every version pin agrees
        # THE DRIFT THAT SHIPPED v0.1.6 (2026-09-22). The root VERSION was
        # bumped to 0.1.6 and every other stamp -- eight files, Cargo.toml,
        # the lock -- stayed at 0.1.5, and no push asked: this check ran only
        # in release.yml, which a tag reaches after it is cut, and refused it
        # there. The same command on every pull request makes a drifted pin red
        # before anybody cuts a mark. First, because it takes a second and
        # names every file that is out of step.
        shell: pwsh
        run: .\version.ps1 sync

      - name: Build the spine
        # BEFORE the battery, deliberately. tests/prove.py reports the atlas
        # binary ABSENT when it is unbuilt -- honest, but it means the door leg
        # proves nothing. Building it first is what makes that leg an answer.
        run: cargo build -p atlas --locked

      - name: gofmt leaves nothing behind
        # THE GATE THAT EARNED THIS WORKFLOW, AND THEN REPEATED THE FAULT IT
        # WAS NAMED AFTER. Its own note read: "three files had never been
        # through gofmt and nobody knew, because the check that found the first
        # one was scoped to a single directory" -- and it was then written with
        # `working-directory: line`. SIX FILES IN webapp/ HAD NEVER BEEN
        # FORMATTED, untouched since 2026-09-09, and this gate could not see a
        # single one of them. Found 2026-09-11 by running gofmt by hand.
        #
        # Both modules now, NAMED. Not a bare `gofmt -l .` from the root: that
        # walks target/ and every vendored tree, which is how a gate gets slow
        # and then gets deleted. A third Go module must be added here on the
        # day it is created -- and this note is why.
        #
        # It reports BOTH before it exits, so one run names every offender
        # rather than one per push.
        shell: bash
        run: |
          fail=0
          for mod in line webapp; do
            out=$(cd "$mod" && gofmt -l .)
            if [ -n "$out" ]; then
              echo "unformatted in $mod:"; echo "$out"; fail=1
            else
              echo "$mod: gofmt -l . is empty"
            fi
          done
          exit $fail

      - name: THE BALL
        # One command, every leg, three verdicts. It runs cargo test, go test
        # and the golden cutters itself -- this workflow does not re-run them
        # separately, because two batteries that can disagree are worse than
        # one that cannot.
        #
        # THE WHOLE BALL, NOT --check (2026-09-22). This line said `--check`,
        # "the fast legs only (no cargo)": it skipped cargo test AND the
        # door's own shipped battery (atlas-mcp --prove) while the comment
        # above promised both. So the spine's version strokes went red at
        # 0c65afc and this gate stayed green over them for four days.
        # release.yml always ran the whole ball; now every run here does. Without
        # the private oracle ground the spine reports ABSENT (its oracle
        # legs), after its version strokes have run -- ABSENT is not red.
        run: python tests/prove.py

  # ---------------------------------------------------------------------
  # THE PORTABILITY PROBE. Its own job on purpose, so a red here can never
  # mask the gate above.
  #
  # The Go half has no platform gating at all -- no _windows.go, no
  # //go:build windows, and `GOOS=linux go build ./...` was verified clean
  # before this file was written. The TESTS, however, have never once run on
  # Linux. They look portable (the Windows-shaped strings in them are test
  # INPUTS -- paths the wall must refuse -- not assumptions), but looking
  # portable is not being portable.
  #
  # SO A RED HERE IS A FINDING, NOT A BROKEN WORKFLOW. It means the Go suites
  # picked up a dependency on the operator's platform, which is exactly the
  # thing the core's own matrix exists to catch ("the suites must not quietly
  # depend on the operator's platform").
  #
  # cargo is absent from this job by design: see the note on the gate.
  # ---------------------------------------------------------------------
  portable:
    name: the go half, off Windows
    # Pinned to the image ubuntu-latest ran on 2026-11-04 (run 41873516439:
    # "Image: ubuntu-26.04, Version: 20261025.179.1").
    runs-on: ubuntu-26.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: line/go.mod
          cache: false

      - name: It builds
        working-directory: line
        run: go build ./...

      - name: It vets
        working-directory: line
        run: go vet ./...

      - name: The webapp builds too
        working-directory: webapp
        run: go build ./...

      - name: The suites, for the first time off Windows
        # A red run's log needs a GitHub sign-in to read; annotations do not, so
        # the failing lines (the test's own file and line, and what it said) are
        # ALSO written as annotations, which the run's summary page and the checks
        # API show to anyone. The verdict is go test's own.
        working-directory: line
        shell: bash {0}
        run: |
          go test ./... 2>&1 | tee "$RUNNER_TEMP/gotest.out"
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            grep -E '^(--- FAIL|FAIL|panic:)|_test\.go:[0-9]+:' "$RUNNER_TEMP/gotest.out" | head -40 | while IFS= read -r l; do echo "::error::${l//%/%25}"; done
          fi
          exit $rc
